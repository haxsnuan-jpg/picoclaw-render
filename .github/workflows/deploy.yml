name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        # Render Deploy Hook men-deploy commit terbaru dari repo yang
        # terhubung. Hook URL disimpan sebagai secret repo (RENDER_DEPLOY_HOOK).
        run: curl -fsSL --retry 3 "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
